# Short description used by search engines and social previews (max ~160 characters).
seo_description: Andrea Mancuso, Operations Research researcher and adjunct professor at the University of Naples Federico II. Optimisation for logistics, healthcare and location.

bio_short: >-
  Andrea Mancuso is a researcher at the Department of Political Science of the University of
  Naples Federico II, where he also teaches Optimization and Decision Making for Management as
  an adjunct professor. He builds mixed-integer programming models, branch-and-cut algorithms and
  matheuristics for truck-and-drone delivery, healthcare operations and covering location
  problems, and combines them with machine learning.

# Paragraphs of the long bio (one item = one paragraph). Plain text; *text* becomes italic.
bio_long:
  - >-
    Andrea Mancuso is a researcher at the Department of Political Science of the University of
    Naples Federico II, where he also teaches *Optimization and Decision Making for Management*
    as an adjunct professor. He holds a PhD in Information and Communication Technology for
    Health and an MSc in Management Engineering (110/110 cum laude) from Federico II. He took
    part in the PRIN 2022 project *ACHILLES* on last-mile logistics and is now part of the PNRR
    MUR project *Insurtech – Ecoscoring*.
  - >-
    His research is in Operations Research, centred on mixed-integer linear programming: new
    formulations, valid inequalities and branch-and-cut algorithms, matheuristics, and machine
    learning used inside combinatorial optimisation. The applications range from truck-and-drone
    delivery systems for the last mile (his paper on the flying sidekick traveling salesman
    problem was among the ten most-cited papers published in *Networks* in 2023) to the planning
    and real-time re-scheduling of operating rooms, the design of regional blood supply chains,
    and covering and facility location problems, including services for the 15-minute city.
  - >-
    He works with the University of Cádiz, where he was a visiting researcher in
    2024 and an Erasmus+ visiting professor in 2026, and with the University of Sheffield. Since
    2024 he has coordinated [EUROYoung](https://euroyoung.eu/), the early-career forum of the Association of European
    Operational Research Societies (EURO), and [AIROYoung](https://airoyoung.airo.org/), the young researchers' section of the
    Italian Operational Research Society (AIRO). In 2025 he chaired the 5th EUROYoung Workshop
    in Naples and organised panels on academic careers, peer review and communicating
    Operations Research. He reviews for journals including the *European Journal of
    Operational Research* and *Transportation Research Part C*.

