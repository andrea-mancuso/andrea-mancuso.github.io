# Open thesis proposals.
# Set draft: false to publish a proposal. Drafts are visible only in local preview (npm run dev).
proposals_intro: >-
  Are you a student interested in optimisation and Operations Research? Here are some thesis
  proposals. If a topic interests you, email me with your degree programme, the exams you have
  passed and your expected graduation date.

proposals:
  - title: Locating services for the 15-minute city
    level: MSc
    draft: true
    description: >-
      Formulate and solve covering and facility location models to decide where to open
      essential services (schools, pharmacies, health centres) so that they can be reached on
      foot or by bike, using real data from an Italian city.
    skills: [Python, Gurobi, geographic data]
  - title: Trucks and drones for last-mile delivery
    level: MSc
    draft: true
    description: >-
      Study variants of the flying sidekick traveling salesman problem and compare MILP
      formulations and heuristics on benchmark instances and realistic scenarios.
    skills: [Python, integer linear programming, heuristics]
  - title: Machine learning to guide the solution of routing problems
    level: MSc
    draft: true
    description: >-
      Train classifiers that anticipate part of the solution (for instance, which customers the
      drone should serve) and measure how much they speed up an exact solver or a matheuristic.
    skills: [Python, scikit-learn, optimisation]
  - title: Optimisation models for electoral districting
    level: MSc
    draft: true
    description: >-
      Formulate political districting as a graph partitioning problem with population balance,
      contiguity and compactness constraints, and apply it to ISTAT data.
    skills: [graph optimisation, Python, territorial data]
