# ------------------------------------------------------------------
# Journal quartiles shown as a badge next to each journal article.
# Source: SCImago Journal Rank (https://www.scimagojr.com), "best quartile" of the journal
# across its subject categories. SCImago publishes new values once a year (usually in spring):
# update `year` and the quartiles then. Journals are matched by name (case, "&"/"and" and
# punctuation are ignored); add `aliases` if a journal appears with another name.
# Journals not listed here simply show no badge.
# ------------------------------------------------------------------

