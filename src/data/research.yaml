- id: last-mile
  title: Trucks, drones and the last mile
  short: Routing a truck and its drone together, so that parcels arrive sooner and with fewer emissions.
  description: >-
    A drone launched from a delivery truck can serve a customer while the truck keeps driving,
    then land on it a few stops later. Deciding who is served by which vehicle, and in which
    order, gives some of the hardest routing problems in the field. I work on the flying
    sidekick traveling salesman problem and the truck–drone team logistics problem, proposing
    new MILP formulations, valid inequalities and branch-and-cut algorithms, two-echelon
    variants and matheuristics for larger instances. Related work covers other
    technology-driven logistics: AGV scheduling with battery constraints, container drayage
    with truck platooning, and incentives for a modal shift in freight transport.
  keywords: [flying sidekick TSP, truck-and-drone routing, synchronisation, branch-and-cut, matheuristics, sustainable logistics]
  figure: drones
  image: ""
  image_alt: Schematic of a truck tour through a set of customers, with a drone leaving the truck to serve some customers and landing on it further along the route.
  papers: [boccia2023fstsp, boccia2024tdtlp, boccia2021twoechelon, amitrano2025drayage, boccia2024agv, simonelli2024freight]

- id: healthcare
  title: Optimisation for healthcare
  short: Operating-room schedules that absorb emergencies, and blood supply chains designed at regional scale.
  description: >-
    Hospitals plan their operating rooms days in advance, then the day itself brings
    emergencies and surgeries that run late. Using real data from hospitals in Naples, I developed
    integer programming tools that build the weekly schedule while keeping room for emergency
    cases, and re-optimise it in real time when something changes. At a larger scale I study
    how a region should organise its blood supply chain, with multi-echelon facility location
    models that balance cost, accessibility and self-sufficiency under uncertainty.
  keywords: [operating room planning and scheduling, re-scheduling, emergency surgery, blood supply chain, multi-echelon facility location]
  figure: health
  image: ""
  image_alt: Gantt chart of four operating rooms over a day, with elective surgeries and an emergency case inserted by re-scheduling.
  papers: [boccia2026online, boccia2024integrated, diglio2024blood, boccia2023surgery, diglio2021blood, mancuso2024phd]

- id: covering
  title: Covering, location and the 15-minute city
  short: Where to place services, and how to reach everyone, when travel is limited by distance or time.
  description: >-
    Covering problems ask how to reach every demand point within a given distance from the
    facilities that are opened or visited. With colleagues at the University of Cádiz and the
    University of Sheffield I study the covering tour problem with arc and path upgrades, where
    part of a budget can be spent to improve the network itself, and the clustered multimode
    set covering location problem. The same
    ideas guide the design of 15-minute cities, where essential services should be reachable
    on foot or by bike, a theme I explore with my thesis students.
  keywords: [covering tour problem, network upgrading, set covering location, facility location, 15-minute city]
  figure: cover
  image: ""
  image_alt: Map of demand points covered by circles around open facilities, linked by a tour; one upgraded road extends the coverage to a previously unreachable point.
  papers: [baldomero2026covering, mancuso2026clustered, baldomero2025arc, amitrano2026classification]

- id: methods
  title: Exact methods meet machine learning
  short: Stronger formulations and cuts, and learning to make the solver's job easier.
  description: >-
    Behind every application is the same question: how to solve a hard combinatorial problem
    to proven optimality, or close to it, in reasonable time. I work on compact MILP
    formulations, families of valid inequalities and branch-and-cut schemes. I also use machine
    learning inside optimisation, for instance training classifiers that predict which
    customers a drone should serve and using them to shrink the problem before it reaches the
    solver, and interpretable machine learning (SHAP) to find behavioural patterns in data, such
    as vehicle emissions.
  keywords: [mixed-integer linear programming, valid inequalities, branch-and-cut, matheuristics, ML for combinatorial optimisation, interpretable ML]
  figure: bnc
  image: ""
  image_alt: A linear-programming polytope with integer points, a cutting plane that removes a fractional vertex, and a small branch-and-bound tree.
  papers: [boccia2024features, amitrano2025classification, boccia2021feature, iodicedenza2026shap]
